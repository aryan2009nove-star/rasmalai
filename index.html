<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Holi Rasmalai 💖</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      overflow: hidden;
      background: linear-gradient(45deg, #ff4e50, #f9d423, #24c6dc, #ff6a00);
      background-size: 400% 400%;
      animation: gradientMove 8s ease infinite;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1 {
      font-size: 3rem;
      color: white;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.4);
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px white; }
      to { text-shadow: 0 0 25px yellow, 0 0 40px pink; }
    }

    img {
      width: 250px;
      border-radius: 20px;
      margin-top: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .colors {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      opacity: 0.7;
      animation: fall 5s linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-100px); }
      100% { transform: translateY(100vh); }
    }
  </style>
</head>
<body>

  <h1>🌈 Happy Holi My Cutie Rasmalai 💖</h1>

  <!-- Replace rasmalai.png with your PNG file name -->
  <img src="rasmalai.png" alt="My Rasmalai">

  <script>
    const colors = ['#ff4e50', '#f9d423', '#24c6dc', '#ff6a00', '#ff0080'];
    for (let i = 0; i < 40; i++) {
      const div = document.createElement('div');
      div.classList.add('colors');
      div.style.left = Math.random() * window.innerWidth + 'px';
      div.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      div.style.animationDuration = (Math.random() * 3 + 2) + 's';
      document.body.appendChild(div);
    }
  </script>

</body>
</html>
